[pytest]
# 用例发现路径：只在这里找测试，避免误收集 .venv 里的东西
testpaths = testcases

# 用例文件/类/函数的命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 【关键】把项目根目录加入 sys.path
# 这样 conftest.py 和用例里可以直接 `from config import ...`、`from utils.xx import ...`
# 不用把包名写得很长，也不用装成本地包。
pythonpath = .

# 默认参数：
#   -v              详细输出（显示每个用例名）
#   -s              不要捕获 stdout，让 print 实时显示
#   --tb=short      断言失败时打印精简堆栈（默认的完整堆栈太长，看不过来）
#   -ra             结束时汇总"非通过"的用例原因（failed/error/skipped/xfail）
#   --strict-markers  未注册的自定义 marker 直接报错，防止拼错 marker 名而不自知
addopts = -v -s --tb=short -ra --strict-markers

# 自定义 marker 注册
# 【为什么要注册】不注册的话 --strict-markers 会报错；
# 更重要的是：报告里能显示 marker，一眼看出哪些是"已知缺陷"用例。
markers =
    smoke: 冒烟用例，快速验证核心链路（每次提交都跑）
    regression: 回归用例，覆盖完整功能（发版前跑）
    known_defect: 已知缺陷用例，预期失败（用 xfail 标记）
    perf: 性能相关用例
