name: QA Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_api_regression:
        description: "Run the full API regression against the configured test environment"
        type: boolean
        default: false

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests PyYAML

      - name: Validate published assets
        run: python .github/scripts/validate_assets.py

      - name: Check pytest discovery
        working-directory: test-artifacts/pytest
        run: pytest --collect-only -q

  api-regression:
    name: API regression (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_api_regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-artifacts/pytest/requirements.txt

      - name: Run API regression
        working-directory: test-artifacts/pytest
        env:
          MALL_ADMIN_BASE: ${{ secrets.MALL_ADMIN_BASE }}
          MALL_ADMIN_USER: ${{ secrets.MALL_ADMIN_USER }}
          MALL_ADMIN_PASS: ${{ secrets.MALL_ADMIN_PASS }}
        run: pytest --html=reports/report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-artifacts/pytest/reports/report.html
          if-no-files-found: warn
